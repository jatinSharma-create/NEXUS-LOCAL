# Production overrides for AWS Lightsail (or any single Ubuntu VM).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Do NOT use --profile tunnel here. Production has a real hostname; ngrok is
# only for a laptop. Do NOT copy a local .env that sets HTTP_PORT=8080 —
# Caddy must own 80 and 443 for Let's Encrypt.

services:
  app:
    environment:
      - NODE_ENV=production
    # App is reached through Caddy, not a public host port.
    ports: []

  worker:
    environment:
      - NODE_ENV=production

  caddy:
    environment:
      - DOMAIN=${DOMAIN}
      - FILES_DOMAIN=${FILES_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-admin@${DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  storage:
    # MinIO only reachable via Caddy (files.yourdomain.com), not the public internet directly
    ports: []
