name: Build and publish images

# The Next.js build peaks well above 2 GB, so it cannot run on a 2 GB
# instance. GitHub's runners build both images and push them to GHCR; the
# server only pulls. This also turns a 30-45 minute deploy into about two
# minutes.

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # `runner` serves Next.js. `worker` adds Chromium for PDFs.
          - target: runner
            image: nexus-app
          - target: worker
            image: nexus-worker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image names, and GitHub usernames can have it.
      - name: Lowercase owner
        id: owner
        run: |
          echo "name=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          target: ${{ matrix.target }}
          # Lightsail is x86_64. Building only amd64 keeps this fast.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
