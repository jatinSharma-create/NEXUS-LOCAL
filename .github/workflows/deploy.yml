name: CI/CD Pipeline - Test & Deploy Nexus

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: app

      - name: Run Type Check
        run: npx tsc --noEmit
        working-directory: app

      - name: Run Linter
        run: npm run lint
        working-directory: app

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/nexus
            git pull origin main
            docker compose up -d --build
            docker compose exec -T db psql -U nexus -d nexus < db/migrate-day5-fixes.sql || true
            docker compose exec -T db psql -U nexus -d nexus < db/migrate-soft-delete.sql || true
            docker compose ps
