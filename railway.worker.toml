# Railway config for the BullMQ worker (separate service from the web app).
# In Railway: New Project → Deploy from GitHub → select repo → branch: deploy
# Set root directory to repo root, then point this service at the worker Dockerfile target.
#
# Or: Railway → New Service → Dockerfile Path: app/Dockerfile, Docker Target: worker

[build]
builder = "DOCKERFILE"
dockerfilePath = "app/Dockerfile"
watchPatterns = ["app/**"]

[build.buildArgs]
# Railway injects env at runtime; build uses worker stage from Dockerfile

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
